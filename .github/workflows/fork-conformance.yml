# SPDX-License-Identifier: BSD-3-Clause
name: Fork conformance
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-conformance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMAXPROCS: 2
      LANG: en_US.UTF-8
      CC: clang
      CGO_LDFLAGS: -fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang lld libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev xorg-dev xvfb language-pack-en fonts-noto-cjk
      - name: Verify modules and format
        run: |
          go mod verify
          task_unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$task_unformatted" ]; then
            printf '%s\n' "$task_unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet -tags ci,migrated_fynedo ./...
      - name: Verify iOS view calculations
        run: |
          clang -std=c11 -Wall -Wextra -Werror internal/driver/mobile/app/testdata/ios_view_geometry.c -lm -o "$RUNNER_TEMP/ios-view-geometry"
          "$RUNNER_TEMP/ios-view-geometry"
      - name: Verify Entry viewport restoration
        run: go test -v -count=1 -race -tags ci,migrated_fynedo ./widget -run '^TestEntry_UndoRestoresFittingViewport$'
      - name: Run runtime and driver regressions
        run: xvfb-run -a go test -count=1 -p=2 -race -tags ci,migrated_fynedo ./...
      - name: Retain failed visual fixtures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fork-failed-fixtures-${{ github.sha }}
          path: '**/testdata/failed'
          if-no-files-found: ignore
  ios-driver:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            target: arm64-apple-ios15.0
          - sdk: iphonesimulator
            target: arm64-apple-ios15.0-simulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify native view and keyboard calculations
        run: |
          clang -std=c11 -Wall -Wextra -Werror internal/driver/mobile/app/testdata/ios_view_geometry.c -lm -o "$RUNNER_TEMP/ios-view-geometry"
          "$RUNNER_TEMP/ios-view-geometry"
          go test -v internal/driver/mobile/app/ios_geometry_source_test.go
      - name: Compile and link the real UIKit driver
        env:
          TASK_IOS_SDK: ${{ matrix.sdk }}
          TASK_IOS_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          xcodebuild -version
          export TASK_IOS_SDK_PATH="$(xcrun --sdk "$TASK_IOS_SDK" --show-sdk-path)"
          export TASK_IOS_CLANG="$(xcrun --sdk "$TASK_IOS_SDK" --find clang)"
          task_go_arch=arm64
          task_main=./cmd/fyne_demo
          if [ "$TASK_IOS_SDK" = iphonesimulator ]; then
            task_main=./internal/driver/mobile/app/testdata/geometryapp
            case "$(uname -m)" in
              arm64) task_go_arch=arm64 ;;
              x86_64) task_go_arch=amd64; export TASK_IOS_TARGET=x86_64-apple-ios15.0-simulator ;;
              *) echo 'Unsupported Apple simulator architecture' >&2; exit 1 ;;
            esac
          fi
          cat > "$RUNNER_TEMP/ios-clang" <<'SH'
          #!/bin/bash
          exec "$TASK_IOS_CLANG" -target "$TASK_IOS_TARGET" -isysroot "$TASK_IOS_SDK_PATH" "$@"
          SH
          chmod +x "$RUNNER_TEMP/ios-clang"
          GOOS=ios GOARCH="$task_go_arch" CGO_ENABLED=1 CC="$RUNNER_TEMP/ios-clang" \
            go build -o "$RUNNER_TEMP/fyne-ios-${TASK_IOS_SDK}" "$task_main"
      - name: Exercise UIKit rotation, reduced viewports, rendering and real taps
        if: matrix.sdk == 'iphonesimulator'
        env:
          TASK_GEOMETRY_BINARY: ${{ runner.temp }}/fyne-ios-iphonesimulator
        run: bash .github/ios-geometry/run.sh
  public-install:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOMAXPROCS: 2
      TASK_FORK_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build against the published module and canonical imports
        run: |
          mkdir public-install
          cd public-install
          go mod init example.org/fyne-fork-install
          cat > main.go <<'GO'
          package main

          import (
            "image"

            "fyne.io/fyne/v2"
            "fyne.io/fyne/v2/canvas"
            "fyne.io/fyne/v2/dialog"
            "fyne.io/fyne/v2/driver/mobile"
          )

          type rectanglePainter struct{}

          func (rectanglePainter) PaintSoftware(*image.NRGBA, canvas.RectanglePaintContext) error {
            return nil
          }

          var _ fyne.URLHandler
          var _ func(func([]fyne.URIReadCloser, error), fyne.Window) = dialog.ShowFileOpenMultiple
          var _ canvas.RectanglePainter = rectanglePainter{}
          var _ = canvas.Rectangle{Painter: rectanglePainter{}}
          var _ = canvas.RectanglePaintContext{
            Origin: fyne.Position{},
            Size: fyne.Size{},
            Scale: 1,
            Clip: image.Rectangle{},
          }
          var _ func(*canvas.Rectangle) error = (*canvas.Rectangle).PaintError
          var _ func(*canvas.Rectangle, error) = (*canvas.Rectangle).SetPaintError
          var _ error = canvas.ErrRectanglePainterUnsupportedGL
          var _ error = canvas.ErrRectanglePainterInvalidGeometry
          var _ func(mobile.TouchFilterCanvas, func(mobile.FilterEvent) mobile.FilterResult) = mobile.TouchFilterCanvas.SetTouchFilter
          var _ = mobile.FilterEvent{Phase: mobile.FilterCancel, Path: []fyne.CanvasObject{}, Size: fyne.Size{}}
          var _ mobile.FilterResult = mobile.FilterClaim

          func main() {}
          GO
          go get fyne.io/fyne/v2@v2.8.1
          go mod edit "-replace=fyne.io/fyne/v2=github.com/thinkddr/fyne/v2@${TASK_FORK_VERSION}"
          go mod tidy
          go mod verify
          go list -m -json fyne.io/fyne/v2
          go build -tags ci .

# SPDX-License-Identifier: BSD-3-Clause
name: Upstream reference
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/upstream-reference.yml
permissions:
  contents: read
jobs:
  upstream-reference:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: 2
      LANG: en_US.UTF-8
      CC: clang
      CGO_LDFLAGS: -fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fyne-io/fyne
          ref: 3dc06f47137aa3709807f1bb78dacc5daf68d551
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang lld libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev xorg-dev xvfb language-pack-en fonts-noto-cjk
      - name: Run the unchanged upstream reference
        run: |
          git rev-parse HEAD
          go version
          go mod verify
          xvfb-run -a go test -count=1 -p=2 -race -tags ci,migrated_fynedo ./...
      - name: Retain failed reference fixtures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstream-reference-${{ matrix.runner }}-${{ github.sha }}
          path: '**/testdata/failed'
          if-no-files-found: ignore

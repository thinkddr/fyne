name: Mobile Tests
on: [push, pull_request]
permissions:
  contents: read
env:
  CC: "clang"
  CGO_LDFLAGS: "-fuse-ld=lld"

jobs:
  mobile_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["", "stable"]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version == '' && 'go.mod' || '' }}

      - name: Get dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang lld libegl1-mesa-dev libgles2-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev xorg-dev fonts-noto-cjk

      - name: Set environment variable LANG
        run: echo "LANG=en_US.UTF-8" >> $GITHUB_ENV

      - name: Tests
        run: xvfb-run go test -race -tags mobile,ci,migrated_fynedo ./...

      - name: Upload failed testdata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: failed-mobile-testdata-${{ matrix.go-version }}
          path: '**/testdata/failed'
          retention-days: 1
          if-no-files-found: ignore

      - name: Compile
        working-directory: cmd/fyne_demo
        run: go build -tags mobile
